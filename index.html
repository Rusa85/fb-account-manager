
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FB Account Manager</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6fb;
  font-family: Arial, sans-serif;
  color: #202638;
}

/* HEADER */

header {
  background: #2074e8;
  color: white;
  padding: 20px;
  font-size: 23px;
  font-weight: bold;
  box-shadow: 0 3px 10px #0001;
}

main {
  padding: 15px;
  max-width: 1200px;
  margin: auto;
}

/* STATISTIK */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.stat {
  background: white;
  border-radius: 13px;
  padding: 17px 5px;
  text-align: center;
  box-shadow: 0 2px 8px #00000008;
}

.stat b {
  display: block;
  font-size: 25px;
  margin-bottom: 5px;
}

.stat small {
  color: #778196;
  font-size: 11px;
  font-weight: bold;
}

.green {
  color: #16865b;
}

.red {
  color: #dc3545;
}

.orange {
  color: #c58b19;
}

/* PANEL */

.panel {
  background: white;
  padding: 16px;
  border-radius: 18px;
  box-shadow: 0 3px 15px #00000008;
}

h3 {
  font-size: 20px;
  margin: 4px 0 18px;
}

/* INPUT */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 13px;
}

input,
select {
  padding: 12px;
  border: 1px solid #dce2eb;
  border-radius: 10px;
  font-size: 14px;
  background: white;
  outline: none;
}

input:focus,
select:focus {
  border-color: #7138db;
}

#search {
  width: 100%;
  margin-bottom: 13px;
  padding: 14px;
}

#name {
  flex: 1;
  min-width: 130px;
}

/* BUTTON */

button {
  border: none;
  background: #7138db;
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

button.add {
  background: linear-gradient(135deg, #8b52ef, #6929d7);
}

button.delete {
  background: #dc4656;
}

button.edit {
  background: #2074e8;
  margin-right: 5px;
}

/* TABLE */

.tablewrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid #e5e9f0;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 650px;
}

th,
td {
  padding: 13px 10px;
  text-align: left;
  border-bottom: 1px solid #e8edf3;
}

th {
  background: #f0f3f8;
  color: #586276;
  font-size: 11px;
  text-transform: uppercase;
  white-space: nowrap;
}

tr:nth-child(even) {
  background: #f8faff;
}

tr:hover {
  background: #eef5ff;
}

/* STATUS */

.status {
  border-radius: 20px;
  padding: 6px 11px;
  font-size: 11px;
  font-weight: bold;
  border: none;
}

.status-live {
  background: #e5f8ed;
  color: #16864c;
}

.status-dead {
  background: #fde8eb;
  color: #c33348;
}

.status-unknown {
  background: #fff3dc;
  color: #a56c00;
}

/* CHECKBOX */

input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #7138db;
}

/* CATATAN */

.note {
  font-size: 12px;
  color: #64748b;
  margin-top: 15px;
  line-height: 1.6;
}

/* HP */

@media (max-width: 600px) {

  header {
    font-size: 21px;
    padding: 20px 16px;
  }

  main {
    padding: 12px;
  }

  .stats {
    gap: 6px;
  }

  .stat {
    padding: 15px 2px;
    border-radius: 12px;
  }

  .stat b {
    font-size: 23px;
  }

  .stat small {
    font-size: 10px;
  }

  .panel {
    padding: 13px;
  }

  #name {
    width: 100%;
    flex: 1 1 100%;
  }

  #newStatus {
    flex: 1;
  }

  button.add {
    flex: 1;
  }

  .controls button {
    min-height: 43px;
  }
}
</style>
</head>

<body>

<header>
  FB Account Manager
</header>

<main>

<!-- STATISTIK -->

<section class="stats">

  <div class="stat">
    <b id="total">0</b>
    <small>TOTAL</small>
  </div>

  <div class="stat">
    <b class="green" id="live">0</b>
    <small>LIVE</small>
  </div>

  <div class="stat">
    <b class="red" id="dead">0</b>
    <small>DEAD</small>
  </div>

  <div class="stat">
    <b class="orange" id="unknown">0</b>
    <small>UNKNOWN</small>
  </div>

</section>

<!-- DASHBOARD -->

<section class="panel">

<h3>Account Dashboard</h3>

<!-- PENCARIAN -->

<input
  id="search"
  placeholder="🔍 Cari nama akun..."
>

<!-- TAMBAH AKUN -->

<div class="controls">

  <input
    id="name"
    placeholder="Nama akun"
  >

  <select id="newStatus">

    <option value="UNKNOWN">UNKNOWN</option>

    <option value="LIVE">LIVE</option>

    <option value="DEAD">DEAD</option>

  </select>

  <button class="add" onclick="addAccount()">
    + Tambah
  </button>

</div>

<!-- HAPUS TERPILIH -->

<div class="controls">

  <button
    class="delete"
    onclick="deleteSelected()"
  >
    Hapus Terpilih
  </button>

</div>

<!-- TABEL -->

<div class="tablewrap">

<table>

<thead>

<tr>

  <th>
    <input
      type="checkbox"
      id="all"
      onchange="selectAll(this.checked)"
    >
  </th>

  <th>NO</th>

  <th>ACCOUNT</th>

  <th>STATUS</th>

  <th>ASSIGNED TO</th>

  <th>AKSI</th>

</tr>

</thead>

<tbody id="rows">
</tbody>

</table>

</div>

<p class="note">
Status akun diisi manual, bukan hasil pemeriksaan Facebook.
Data tersimpan hanya pada browser dan perangkat ini.
Jangan masukkan password, token, atau cookies login.
</p>

</section>

</main>

<script>

// PENYIMPANAN DATA
// Menggunakan KEY yang sama agar data lama tetap terbaca.

const KEY = "fbmanager_accounts_v2";

let accounts = [];

try {

  const saved = JSON.parse(
    localStorage.getItem(KEY) || "[]"
  );

  if (Array.isArray(saved)) {
    accounts = saved;
  }

} catch (e) {

  accounts = [];

}

const $ = id => document.getElementById(id);


// SIMPAN DATA

function save() {

  localStorage.setItem(
    KEY,
    JSON.stringify(accounts)
  );

  render();

}


// TAMBAH AKUN

function addAccount() {

  const name = $("name").value.trim();

  if (!name) {
    return alert("Masukkan nama akun");
  }

  accounts.push({

    id: Date.now() + "-" + Math.random(),

    name: name,

    status: $("newStatus").value,

    assigned: "Unassigned"

  });

  $("name").value = "";

  save();

}


// EDIT NAMA AKUN

function editAccount(id) {

  const account = accounts.find(
    x => x.id === id
  );

  if (!account) return;

  const newName = prompt(
    "Masukkan nama akun baru:",
    account.name
  );

  if (newName === null) return;

  const cleanName = newName.trim();

  if (!cleanName) {

    return alert(
      "Nama akun tidak boleh kosong"
    );

  }

  account.name = cleanName;

  save();

}


// UBAH STATUS

function changeStatus(id, value) {

  const account = accounts.find(
    x => x.id === id
  );

  if (account) {

    account.status = value;

    save();

  }

}


// HAPUS SATU AKUN

function deleteOne(id) {

  if (confirm("Hapus akun ini?")) {

    accounts = accounts.filter(
      x => x.id !== id
    );

    save();

  }

}


// PILIH SEMUA

function selectAll(checked) {

  document.querySelectorAll(".pick")
    .forEach(x => x.checked = checked);

}


// HAPUS TERPILIH

function deleteSelected() {

  const ids = [
    ...document.querySelectorAll(".pick:checked")
  ].map(x => x.value);

  if (!ids.length) {

    return alert(
      "Pilih akun terlebih dahulu"
    );

  }

  if (
    confirm(
      "Hapus " + ids.length + " akun?"
    )
  ) {

    accounts = accounts.filter(
      x => !ids.includes(x.id)
    );

    save();

  }

}


// TAMPILKAN DASHBOARD

function render() {

  // JUMLAH TOTAL

  $("total").textContent = accounts.length;


  // JUMLAH BERDASARKAN STATUS

  ["LIVE", "DEAD", "UNKNOWN"].forEach(status => {

    $(status.toLowerCase()).textContent =
      accounts.filter(
        a => a.status === status
      ).length;

  });


  // RESET CHECKBOX

  $("all").checked = false;


  // PENCARIAN

  const query = $("search").value.toLowerCase();


  // TABEL

  const tbody = $("rows");

  tbody.replaceChildren();


  accounts

    .filter(
      a => a.name.toLowerCase().includes(query)
    )

    .forEach((account, index) => {

      const tr = document.createElement("tr");


      // CHECKBOX

      const pick = document.createElement("input");

      pick.type = "checkbox";

      pick.className = "pick";

      pick.value = account.id;

      const td0 = document.createElement("td");

      td0.append(pick);


      // NOMOR

      const td1 = document.createElement("td");

      td1.textContent = index + 1;


      // NAMA AKUN

      const td2 = document.createElement("td");

      td2.textContent = account.name;


      // STATUS

      const td3 = document.createElement("td");

      const select = document.createElement("select");

      select.className = "status";


      // PILIHAN STATUS

      ["UNKNOWN", "LIVE", "DEAD"].forEach(status => {

        const option = document.createElement("option");

        option.value = status;

        option.textContent = status;

        select.append(option);

      });


      // STATUS AKUN

      select.value = account.status;


      // WARNA STATUS

      function updateStatusColor() {

        select.classList.remove(
          "status-live",
          "status-dead",
          "status-unknown"
        );

        select.classList.add(
          "status-" + select.value.toLowerCase()
        );

      }

      updateStatusColor();


      // SIMPAN PERUBAHAN STATUS

      select.onchange = () => {

        changeStatus(
          account.id,
          select.value
        );

      };

      td3.append(select);


      // ASSIGNED TO

      const td4 = document.createElement("td");

      td4.textContent = account.assigned || "Unassigned";


      // AKSI

      const td5 = document.createElement("td");


      // TOMBOL EDIT

      const editButton = document.createElement("button");

      editButton.className = "edit";

      editButton.textContent = "Edit";

      editButton.onclick = () =>
        editAccount(account.id);


      // TOMBOL HAPUS

      const deleteButton = document.createElement("button");

      deleteButton.className = "delete";

      deleteButton.textContent = "Hapus";

      deleteButton.onclick = () =>
        deleteOne(account.id);


      // MASUKKAN TOMBOL

      td5.append(
        editButton,
        deleteButton
      );


      // MASUKKAN BARIS

      tr.append(
        td0,
        td1,
        td2,
        td3,
        td4,
        td5
      );

      tbody.append(tr);

    });

}


// PENCARIAN

$("search").addEventListener(
  "input",
  render
);


// TAMPILKAN DASHBOARD

render();

</script>

</body>
</html>
